<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Inbound Timeline Viewer</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
            background: #1e1e1e;
            color: #ffffff;
        }
        h1 {
            font-size: 1.6em;
            color: #ffffff;
        }

        .accordion {
            background-color: rgb(255, 182, 26);
            color: rgb(0, 43, 73);
            font-weight: bold;
            cursor: pointer;
            padding: 14px;
            margin-bottom: 5px;
            width: 100%;
            border: none;
            text-align: left;
            font-size: 1em;
            border-radius: 6px;
            transition: background-color 0.2s ease;
        }

        .accordion:hover {
            background-color: rgb(255, 199, 60);
        }

        .accordion.active {
            background-color: rgb(255, 199, 60);
        }

        .panel {
            display: none;
            overflow: hidden;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #2b2b2b;
            color: #ffffff;
            border-radius: 6px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        th {
            background-color: #333;
            color: #fff;
            border-bottom: 2px solid #444;
        }

        td {
            border-bottom: 1px solid #444;
        }

        .shipment-toggle {
            background: none;
            border: 1px solid #666;
            color: #ffb61a;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            font-family: inherit;
        }

        .shipment-toggle:hover {
            background: #3a3a3a;
        }

        tr.shipment-detail td {
            color: #bbb;
            background: #262626;
        }
    </style>
</head>
<body>
    <h1>Inbound Product Timeline</h1>
    <div id="container">Loading data...</div>

    <h1>Inbound Products by Category</h1>
    <div id="category-container">Loading data...</div>

    <script>
        function groupBy(data, keyFn) {
            const groups = {};
            data.forEach(item => {
                const key = keyFn(item);
                if (!groups[key]) groups[key] = [];
                groups[key].push(item);
            });
            return groups;
        }

        // Renders one accordion button + table per group into containerId, in groupOrder.
        // Each column spec is one of:
        //   {header, type: "identity", value: item => ...} -- a plain per-item value
        //   {header, type: "eta"}                           -- shows the single shipment's ETA,
        //                                                       or (2+ shipments) a toggle button
        //   {header, type: "quantity"}                      -- shows the single shipment's qty,
        //                                                       or (2+ shipments) the total
        // getShipments(item) returns that item's shipment list. An item with 2+ shipments
        // renders one collapsed summary row (ETA column becomes a "N shipments" toggle,
        // Quantity shows the total) plus N hidden detail rows toggled by that button --
        // keeps the table short by default while still surfacing "there's a PO placed"
        // per shipment on demand. 0 or 1 shipments render as a single plain row, as before.
        // spacerBeforeGroup optionally inserts extra top margin before a given group name
        // (used to set "Out of Stocks" apart).
        function renderAccordionSection(containerId, groups, groupOrder, columnSpecs, getShipments, spacerBeforeGroup) {
            const container = document.getElementById(containerId);
            container.innerHTML = "";

            groupOrder.forEach(groupName => {
                const items = groups[groupName];
                if (!items || !items.length) return;

                if (spacerBeforeGroup && groupName === spacerBeforeGroup) {
                    const spacer = document.createElement("div");
                    spacer.style.marginTop = "40px";
                    container.appendChild(spacer);
                }

                const btn = document.createElement("button");
                btn.className = "accordion";
                btn.textContent = groupName;
                container.appendChild(btn);

                const panel = document.createElement("div");
                panel.className = "panel";
                panel.style.display = "block";
                btn.classList.add("active");

                const table = document.createElement("table");
                const thead = document.createElement("thead");
                thead.innerHTML = `<tr>${columnSpecs.map(c => `<th>${c.header}</th>`).join("")}</tr>`;
                table.appendChild(thead);

                const tbody = document.createElement("tbody");
                items.forEach(item => {
                    const shipments = getShipments(item);
                    const many = shipments.length > 1;
                    const single = shipments.length === 1 ? shipments[0] : null;
                    const totalQty = shipments.reduce((sum, s) => sum + (s.quantity || 0), 0);

                    const summaryRow = document.createElement("tr");
                    summaryRow.innerHTML = columnSpecs.map(col => {
                        if (col.type === "identity") return `<td>${col.value(item) || "-"}</td>`;
                        if (col.type === "eta") {
                            if (many) return `<td><button type="button" class="shipment-toggle">&#9654; ${shipments.length} shipments</button></td>`;
                            return `<td>${(single ? single.eta : null) || "-"}</td>`;
                        }
                        if (col.type === "quantity") {
                            if (many) return `<td>${totalQty}</td>`;
                            const qty = single ? single.quantity : null;
                            return `<td>${(qty === null || qty === undefined) ? "-" : qty}</td>`;
                        }
                        return "<td>-</td>";
                    }).join("");
                    tbody.appendChild(summaryRow);

                    if (many) {
                        const detailRows = shipments.map(shipment => {
                            const row = document.createElement("tr");
                            row.className = "shipment-detail";
                            row.style.display = "none";
                            row.innerHTML = columnSpecs.map(col => {
                                if (col.type === "eta") return `<td>${shipment.eta || "-"}</td>`;
                                if (col.type === "quantity") return `<td>${shipment.quantity}</td>`;
                                return "<td></td>";
                            }).join("");
                            return row;
                        });
                        detailRows.forEach(row => tbody.appendChild(row));

                        const toggleBtn = summaryRow.querySelector(".shipment-toggle");
                        let expanded = false;
                        toggleBtn.addEventListener("click", () => {
                            expanded = !expanded;
                            detailRows.forEach(row => { row.style.display = expanded ? "table-row" : "none"; });
                            toggleBtn.innerHTML = `${expanded ? "&#9660;" : "&#9654;"} ${shipments.length} shipments`;
                        });
                    }
                });
                table.appendChild(tbody);
                panel.appendChild(table);
                container.appendChild(panel);

                btn.addEventListener("click", function () {
                    const isOpen = panel.style.display === "block";
                    panel.style.display = isOpen ? "none" : "block";
                    btn.classList.toggle("active", !isOpen);
                });
            });
        }

        fetch("Inbound_Timeline.json?v=" + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                const groups = groupBy(data, item => item.group);
                const groupOrder = ["This Month", "Next Month", "2+ Months Out", "TBA", "Out of Stocks"];
                renderAccordionSection(
                    "container", groups, groupOrder,
                    [
                        { header: "SKU", type: "identity", value: item => item.sku },
                        { header: "Description", type: "identity", value: item => item.description },
                        { header: "ETA", type: "eta" },
                        { header: "Communicated Date", type: "identity", value: item => item.communicated_date },
                        { header: "Quantity", type: "quantity" },
                    ],
                    item => item.shipments || [],
                    "Out of Stocks"
                );
            })
            .catch(err => {
                document.getElementById("container").textContent = "Failed to load data.";
                console.error(err);
            });

        fetch("Inbound_By_Category.json?v=" + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                const groups = groupBy(data, item => item.category || "Uncategorized");
                const groupOrder = Object.keys(groups).sort();
                renderAccordionSection(
                    "category-container", groups, groupOrder,
                    [
                        { header: "SKU", type: "identity", value: item => item.sku },
                        { header: "Description", type: "identity", value: item => item.description },
                        { header: "ETA", type: "eta" },
                        { header: "Quantity", type: "quantity" },
                    ],
                    item => item.shipments || []
                );
            })
            .catch(err => {
                document.getElementById("category-container").textContent = "Failed to load data.";
                console.error(err);
            });
    </script>
</body>
</html>
