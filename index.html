<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Inbound Timeline Viewer</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
            background: #1e1e1e;
            color: #ffffff;
        }
        h1 {
            font-size: 1.6em;
            color: #ffffff;
        }

        .accordion {
            background-color: rgb(255, 182, 26);
            color: rgb(0, 43, 73);
            font-weight: bold;
            cursor: pointer;
            padding: 14px;
            margin-bottom: 5px;
            width: 100%;
            border: none;
            text-align: left;
            font-size: 1em;
            border-radius: 6px;
            transition: background-color 0.2s ease;
        }

        .accordion:hover {
            background-color: rgb(255, 199, 60);
        }

        .accordion.active {
            background-color: rgb(255, 199, 60);
        }

        .panel {
            display: none;
            overflow: hidden;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #2b2b2b;
            color: #ffffff;
            border-radius: 6px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        th {
            background-color: #333;
            color: #fff;
            border-bottom: 2px solid #444;
        }

        td {
            border-bottom: 1px solid #444;
        }
    </style>
</head>
<body>
    <h1>Inbound Product Timeline</h1>
    <div id="container">Loading data...</div>

    <h1>Inbound Products by Category</h1>
    <div id="category-container">Loading data...</div>

    <script>
        function groupBy(data, keyFn) {
            const groups = {};
            data.forEach(item => {
                const key = keyFn(item);
                if (!groups[key]) groups[key] = [];
                groups[key].push(item);
            });
            return groups;
        }

        // Renders one accordion button + table per group into containerId, in groupOrder.
        // columns/rowValues describe the table shape; spacerBeforeGroup optionally inserts
        // extra top margin before a given group name (used to set "Out of Stocks" apart).
        function renderAccordionSection(containerId, groups, groupOrder, columns, rowValues, spacerBeforeGroup) {
            const container = document.getElementById(containerId);
            container.innerHTML = "";

            groupOrder.forEach(groupName => {
                const items = groups[groupName];
                if (!items || !items.length) return;

                if (spacerBeforeGroup && groupName === spacerBeforeGroup) {
                    const spacer = document.createElement("div");
                    spacer.style.marginTop = "40px";
                    container.appendChild(spacer);
                }

                const btn = document.createElement("button");
                btn.className = "accordion";
                btn.textContent = groupName;
                container.appendChild(btn);

                const panel = document.createElement("div");
                panel.className = "panel";
                panel.style.display = "block";
                btn.classList.add("active");

                const table = document.createElement("table");
                const thead = document.createElement("thead");
                thead.innerHTML = `<tr>${columns.map(c => `<th>${c}</th>`).join("")}</tr>`;
                table.appendChild(thead);

                const tbody = document.createElement("tbody");
                items.forEach(item => {
                    const row = document.createElement("tr");
                    row.innerHTML = rowValues(item).map(v => `<td>${v || "-"}</td>`).join("");
                    tbody.appendChild(row);
                });
                table.appendChild(tbody);
                panel.appendChild(table);
                container.appendChild(panel);

                btn.addEventListener("click", function () {
                    const isOpen = panel.style.display === "block";
                    panel.style.display = isOpen ? "none" : "block";
                    btn.classList.toggle("active", !isOpen);
                });
            });
        }

        fetch("Inbound_Timeline.json?v=" + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                const groups = groupBy(data, item => item.group);
                const groupOrder = ["This Month", "Next Month", "2+ Months Out", "TBA", "Out of Stocks"];
                renderAccordionSection(
                    "container", groups, groupOrder,
                    ["SKU", "Description", "ETA", "Communicated Date", "Quantity"],
                    item => [item.sku, item.description, item.eta, item.communicated_date, item.quantity],
                    "Out of Stocks"
                );
            })
            .catch(err => {
                document.getElementById("container").textContent = "Failed to load data.";
                console.error(err);
            });

        fetch("Inbound_By_Category.json?v=" + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                const groups = groupBy(data, item => item.category || "Uncategorized");
                const groupOrder = Object.keys(groups).sort();
                renderAccordionSection(
                    "category-container", groups, groupOrder,
                    ["SKU", "Description", "ETA", "Quantity"],
                    item => [item.sku, item.description, item.eta, item.quantity]
                );
            })
            .catch(err => {
                document.getElementById("category-container").textContent = "Failed to load data.";
                console.error(err);
            });
    </script>
</body>
</html>
